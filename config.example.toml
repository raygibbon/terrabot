[agent]
name = "Terri"

[ollama]
endpoint = "http://127.0.0.1:11434"
# auto: discover installed models; F6 selects and saves an endpoint-specific choice.
model = "auto"
num_ctx = 8192
num_predict = 2048
timeout_seconds = 300
# Optional second, bounded request AFTER a completed reply. Invalid cues are ignored.
emotion_cues = false

[interface]
theme = "dark" # dark or light
show_terri = true # legacy show_terry is accepted as an alias
animation = true
animation_fps = 20 # 1–60; see measured results in docs/performance.md
animation_intensity = 1.0 # 0–1; lower values reduce movement
palette = "auto" # auto, truecolor, indexed, ascii

[pet]
persist = true
# All pet actions are local; F4 opens pet controls without sending a prompt.
autonomous = true
daily_routine = true # local day/night bias; never blocks conversations
develop_preferences = true
reset_personality = false # reset learned life traits on each launch while enabled
diagnostics = false # activity, needs, utility scores, position, tick
seed = 361940275785
# Wander, Sit, Play, Investigate, Sleep, Wake, Dance, Stumble, Watch, Celebrate.
# New activities inherit related category weights (rest uses Sit; nap uses Sleep).
# Each weight 0–1000. At least one must be nonzero. Low energy can still select rest.
behaviour_weights = [24, 14, 22, 16, 3, 0, 8, 1, 12, 0]

[security]
tools_enabled = false
mcp_enabled = false
shell_enabled = false
