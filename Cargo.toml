[package]
name = "terrabot"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Local Ollama chat with Terri, a living terminal companion"

[dependencies]
terragame-core = { path = "../terragame/crates/terragame-core" }
terrabox = { path = "../terrabox/crates/terrabox" }
terratui = { path = "../terrabox/crates/terratui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros"] }
futures-util = "0.3"
unicode-segmentation = "1.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
